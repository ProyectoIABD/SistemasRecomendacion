<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selecciona tus 3 géneros favoritos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Selecciona tus 3 géneros favoritos</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flashes">
        {% for category, message in messages %}
          <li class="{{ category }}">{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    <form method="post">
        {% for genero in generos %}
            <label>
                <input type="checkbox" name="generos" value="{{ genero }}" {% if genero in seleccionados %}checked{% endif %}>
                {{ genero }}
            </label><br>
        {% endfor %}
        <br>
        <button type="submit">Guardar favoritos</button>
    </form>
</body>
</html>
